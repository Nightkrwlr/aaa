<title>Operación Eclipse</title>
<meta name="description" content="Shooter isométrico de exploración: un operador de fuerzas especiales contra una invasión alienígena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Concepto: HUD táctico militar sobre un mundo isométrico; ámbar de visor nocturno + cian de escudo, paneles de chapa oscura */
:root {
  --bg: #07090b; --panel: rgba(13, 18, 21, 0.92); --panel2: rgba(22, 30, 34, 0.95); --line: rgba(255, 178, 64, 0.22); --line2: rgba(160, 190, 200, 0.14);
  --amber: #ffb340; --amber2: #ffd27a; --cyan: #46e4ff; --hp: #ff3d4f; --xp: #5dff9a; --text: #e6ebee; --muted: #8b989f; --dim: #5a666d; --good: #5fd35a; --bad: #ff4f5e;
  --f-disp: 'Chakra Petch', 'Rajdhani', 'Arial Narrow', sans-serif; --f-body: 'Barlow Semi Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-body); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: fixed; inset: 0; overflow: hidden; }
#gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov { pointer-events: none; }
button { font-family: var(--f-disp); cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.disp { font-family: var(--f-disp); letter-spacing: 0.04em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- HUD */
#hud { position: absolute; inset: 0; pointer-events: none; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.hpanel { background: linear-gradient(180deg, rgba(10,14,16,0.82), rgba(10,14,16,0.6)); border: 1px solid var(--line2); border-left: 2px solid var(--amber); padding: 8px 10px; backdrop-filter: blur(3px); }
#hTL { position: absolute; left: 12px; top: 10px; width: min(330px, 46vw); display: flex; flex-direction: column; gap: 6px; }
.who { display: flex; align-items: center; gap: 10px; }
.badge { width: 40px; height: 40px; flex: none; display: grid; place-items: center; background: #11181b; border: 1px solid var(--amber); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); font-family: var(--f-disp); font-weight: 700; font-size: 17px; color: var(--amber); }
.who .nm { font-family: var(--f-disp); font-weight: 600; font-size: 15px; line-height: 1.1; }
.who .rk { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.bar { position: relative; height: 14px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; display: block; transition: width .12s linear; }
.bar .hp { background: linear-gradient(90deg, #b8162a, var(--hp)); }
.bar .hpl { background: rgba(255,255,255,0.35); transition: width .6s ease .2s; }
.bar .sh { background: linear-gradient(90deg, rgba(70,228,255,0.55), rgba(70,228,255,0.85)); height: 5px; top: 0; bottom: auto; }
.bar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 11px var(--f-disp); text-shadow: 0 1px 2px #000; letter-spacing: .05em; }
.xpbar { height: 5px; } .xpbar i { background: var(--xp); box-shadow: 0 0 8px var(--xp); }
#buffs { display: flex; flex-wrap: wrap; gap: 4px; min-height: 0; }
.buff { font: 600 11px var(--f-disp); padding: 2px 6px; border: 1px solid currentColor; background: rgba(0,0,0,0.55); letter-spacing: .03em; }
#hTC { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); text-align: center; width: min(560px, 60vw); }
#bossbar { display: none; margin-top: 4px; }
#bossbar .bn { font: 700 16px var(--f-disp); letter-spacing: .12em; text-transform: uppercase; color: #ffd0d0; text-shadow: 0 0 12px rgba(255,40,40,0.6); }
#bossbar .bt { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
#bossbar .bar { height: 12px; border-color: rgba(255,80,80,0.4); } #bossbar .bar i { background: linear-gradient(90deg, #7a0d18, #ff3d4f); }
#clock { font: 600 12px var(--f-disp); color: var(--muted); letter-spacing: .12em; }
#hTR { position: absolute; right: 12px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#mini { width: 176px; height: 176px; border: 1px solid var(--line); background: rgba(5,8,10,0.75); display: block; }
#res { display: flex; gap: 10px; font: 600 13px var(--f-disp); }
#res span { display: inline-flex; gap: 4px; align-items: center; }
#tracker { position: absolute; right: 12px; top: 230px; width: min(270px, 40vw); display: flex; flex-direction: column; gap: 6px; }
.trk { background: rgba(8,12,14,0.62); border-right: 2px solid var(--amber); padding: 6px 9px; }
.trk .tt { font: 600 13px var(--f-disp); color: var(--amber2); }
.trk .tt.main { color: #ffd447; } .trk .ob { font-size: 13px; color: #cfd8dc; line-height: 1.3; } .trk .ob.done { color: var(--good); text-decoration: line-through; opacity: .8; }
#hB { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; align-items: flex-end; }
.wslot { width: 190px; padding: 6px 9px; background: rgba(10,14,16,0.78); border: 1px solid var(--line2); position: relative; }
.wslot.on { border-color: var(--amber); box-shadow: 0 0 0 1px rgba(255,179,64,0.25) inset; }
.wslot .wn { font: 600 13px var(--f-disp); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wslot .wa { font: 600 12px var(--f-disp); color: var(--muted); display: flex; justify-content: space-between; }
.wslot .bar { height: 4px; margin-top: 4px; } .wslot .bar i { background: var(--amber); }
.wslot .key { position: absolute; top: -9px; right: 6px; font: 700 10px var(--f-disp); background: #1a2226; border: 1px solid var(--line2); padding: 0 4px; color: var(--muted); }
.cons { display: flex; gap: 6px; }
.cbtn { width: 52px; height: 52px; background: rgba(10,14,16,0.78); border: 1px solid var(--line2); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font: 700 16px var(--f-disp); }
.cbtn small { font: 600 10px var(--f-disp); color: var(--muted); }
.cbtn .k { position: absolute; top: -8px; left: 4px; font: 700 10px var(--f-disp); background: #1a2226; border: 1px solid var(--line2); padding: 0 4px; color: var(--muted); }
.cbtn .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,179,64,0.25); }
#prompt { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); font: 600 15px var(--f-disp); background: rgba(8,12,14,0.85); border: 1px solid var(--line); padding: 6px 14px; display: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
#prompt kbd { font: 700 13px var(--f-disp); color: #111; background: var(--amber); padding: 0 6px; margin-right: 8px; }
#hazard { position: absolute; left: 12px; bottom: 90px; font: 700 14px var(--f-disp); padding: 6px 10px; display: none; letter-spacing: .06em; background: rgba(40,8,8,0.7); border: 1px solid rgba(255,80,80,0.5); }
#combo { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font: 700 34px var(--f-disp); color: var(--amber); text-shadow: 0 0 18px rgba(255,160,40,0.6); display: none; }
#combo small { display: block; font-size: 12px; letter-spacing: .3em; color: var(--muted); }
#lootfeed { position: absolute; left: 12px; bottom: 140px; display: flex; flex-direction: column; gap: 3px; width: min(320px, 70vw); }
.lf { font: 600 13px var(--f-disp); background: rgba(8,12,14,0.75); padding: 3px 8px; border-left: 3px solid currentColor; animation: lfIn .25s ease-out; }
@keyframes lfIn { from { transform: translateX(-20px); opacity: 0; } }
#toasts { position: absolute; right: 12px; bottom: 90px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; pointer-events: none; z-index: 30; }
.toast { font: 600 14px var(--f-disp); background: rgba(10,14,16,0.92); border: 1px solid var(--line2); border-right: 3px solid var(--amber); padding: 6px 12px; max-width: min(440px, 86vw); animation: tIn .25s ease-out; }
.toast.good { border-right-color: var(--good); } .toast.bad { border-right-color: var(--bad); } .toast.warn { border-right-color: #ffcf40; } .toast.quest { border-right-color: #ffd447; color: #ffe9a8; }
@keyframes tIn { from { transform: translateY(10px); opacity: 0; } }
#banner { position: absolute; left: 0; right: 0; top: 22%; text-align: center; pointer-events: none; z-index: 25; }
#banner .b1 { font: 700 clamp(26px, 5vw, 52px) var(--f-disp); letter-spacing: .14em; text-transform: uppercase; text-shadow: 0 0 30px rgba(0,0,0,0.9), 0 2px 0 #000; }
#banner .b2 { font: 600 clamp(13px, 1.8vw, 18px) var(--f-disp); letter-spacing: .3em; color: var(--amber2); text-transform: uppercase; text-shadow: 0 2px 6px #000; }
#banner .rule { height: 1px; width: min(520px, 70vw); margin: 8px auto; background: linear-gradient(90deg, transparent, var(--amber), transparent); }
.bIn { animation: bIn 3.2s ease forwards; }
@keyframes bIn { 0% { opacity: 0; letter-spacing: .5em; } 12% { opacity: 1; letter-spacing: .14em; } 80% { opacity: 1; } 100% { opacity: 0; } }
#hurt { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px rgba(255,0,20,0.0); }

/* ---------- Paneles */
#panel { position: absolute; inset: 0; z-index: 40; background: rgba(3,5,6,0.72); display: flex; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(2px); }
.win { background: var(--panel); border: 1px solid var(--line); width: min(1100px, 100%); max-height: min(92vh, 100%); display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,0.6); position: relative; }
.win::before { content: ''; position: absolute; left: -1px; top: -1px; width: 22px; height: 22px; border-left: 2px solid var(--amber); border-top: 2px solid var(--amber); }
.win::after { content: ''; position: absolute; right: -1px; bottom: -1px; width: 22px; height: 22px; border-right: 2px solid var(--amber); border-bottom: 2px solid var(--amber); }
.whead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
.whead h2 { margin: 0; font: 700 20px var(--f-disp); letter-spacing: .1em; text-transform: uppercase; flex: 1; min-width: 0; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid var(--line2); color: var(--muted); font: 600 13px var(--f-disp); padding: 5px 11px; letter-spacing: .06em; text-transform: uppercase; }
.tab.on { color: #111; background: var(--amber); border-color: var(--amber); }
.x { background: transparent; border: 1px solid var(--line2); color: var(--text); width: 34px; height: 34px; font-size: 18px; }
.wbody { overflow: auto; padding: 12px 14px; flex: 1; min-height: 0; }
.btn { background: #1c262b; color: var(--text); border: 1px solid var(--line2); font: 600 14px var(--f-disp); padding: 7px 14px; letter-spacing: .05em; }
.btn:hover { border-color: var(--amber); }
.btn.pri { background: var(--amber); color: #15100a; border-color: var(--amber); }
.btn.pri:hover { background: var(--amber2); }
.btn.bad { border-color: rgba(255,79,94,0.5); color: #ffb0b8; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 14px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.sec { font: 700 12px var(--f-disp); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); margin: 10px 0 6px; }
.eq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.slot { min-height: 54px; background: rgba(0,0,0,0.35); border: 1px solid var(--line2); border-left: 2px solid var(--rc); padding: 5px 7px; cursor: pointer; position: relative; display: flex; align-items: center; gap: 8px; -webkit-tap-highlight-color: transparent; }
.slot .sic { width: 40px; height: 40px; flex: none; display: grid; place-items: center; background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 22%, transparent), rgba(0,0,0,0.5)); border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent); position: relative; padding: 4px; }
.slot .sic svg { width: 24px; height: 24px; }
.slot.empty .sic { opacity: .45; }
.slot .sic .up { position: absolute; left: 2px; bottom: 0; font: 700 9px var(--f-disp); color: var(--amber2); }
.slot .sic .act { position: absolute; right: 2px; top: -1px; font-size: 9px; color: var(--amber); }
.slot .stx { min-width: 0; flex: 1; }
.slot .sl { font: 600 10px var(--f-disp); color: var(--dim); text-transform: uppercase; letter-spacing: .12em; }
.slot .si { font: 600 13px var(--f-disp); line-height: 1.15; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.invdet { position: relative; }
.wbdet:not(.open) { display: block; }
.slot .sl .shn { display: none; }
.invdx { display: none; }
.slot.sel { outline: 2px solid var(--amber); }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 5px; }
.cell { aspect-ratio: 1; max-width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--line2); position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; font: 600 10px var(--f-disp); padding: 3px; overflow: hidden; }
.cell .ic { font-size: 22px; line-height: 1; }
.cell .lv { position: absolute; right: 3px; bottom: 1px; font-size: 10px; color: #e6ebee; font-weight: 700; }
.cell .nw { position: absolute; left: 3px; top: 2px; width: 6px; height: 6px; background: var(--amber); border-radius: 50%; }
.item .pwr { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 4px; flex-wrap: wrap; }
.item .pwr b { font: 700 24px var(--f-disp); color: #ffe9a8; } .item .pwr span { font: 700 10px var(--f-disp); letter-spacing: .16em; color: var(--muted); }
.item .pwr em { font: 600 13px var(--f-disp); font-style: normal; } .item .pwr em.up { color: var(--good); } .item .pwr em.dn { color: var(--bad); }
.cell .bt { position: absolute; left: 3px; top: 10px; color: #5fd35a; font-size: 11px; font-weight: 700; }
.cell .rp { position: absolute; left: 0; right: 0; top: 1px; font-size: 7px; letter-spacing: 1px; line-height: 1; text-align: center; }
.cell .up { position: absolute; left: 3px; bottom: 1px; font-size: 10px; color: var(--amber2); }
.cell.sel { outline: 2px solid var(--amber); }
.cell.msel { outline: 2px solid #7ed957; outline-offset: -2px; filter: brightness(1.15); }
.cell .chk { position: absolute; left: 2px; top: 1px; width: 16px; height: 16px; border-radius: 3px; background: #7ed957; color: #0b1010; font: 800 12px/16px var(--f-disp); }
.mbar { display: flex; flex-direction: column; gap: 6px; padding: 8px; margin: 6px 0 8px; background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 4px; }
.mbar .mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rchip { font: 600 12px var(--f-disp); color: var(--c, var(--text)); background: rgba(0,0,0,.35); border: 1px solid var(--c, var(--line2)); border-radius: 3px; padding: 4px 9px; cursor: pointer; }
.rchip small { opacity: .7; margin-left: 3px; }
.rchip.on { background: var(--c); color: #0b1010; }
.cell.lock::after { content: '★'; position: absolute; top: 1px; right: 3px; color: #ffd447; font-size: 11px; }
.item { border: 1px solid var(--line2); background: var(--panel2); padding: 10px 12px; min-width: 0; }
.item h3 { margin: 0 0 2px; font: 700 17px var(--f-disp); }

.item ul { margin: 8px 0 0; padding: 0; list-style: none; }

.item li.imp { color: #cfd8dc; } .item li.aff { color: #9fd0ff; } .item li.pow { color: var(--amber2); margin-top: 4px; }
.cmp { font: 600 12px var(--f-disp); } .cmp.up { color: var(--good); } .cmp.dn { color: var(--bad); }
.stats { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; font-size: 14px; }
.stats .v { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--f-disp); }
.card { border: 1px solid var(--line2); background: var(--panel2); padding: 10px 12px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.q { border: 1px solid var(--line2); padding: 8px 10px; background: rgba(0,0,0,0.25); margin-bottom: 8px; }
.q h4 { margin: 0; font: 700 15px var(--f-disp); }
.q p { margin: 4px 0; font-size: 14px; color: #cdd5d9; line-height: 1.4; }
.tag { display: inline-block; font: 700 10px var(--f-disp); letter-spacing: .1em; padding: 1px 6px; border: 1px solid currentColor; text-transform: uppercase; }
.dlg { width: min(720px, 100%); }
.dlg .say { font-size: 17px; line-height: 1.5; padding: 4px 2px 10px; color: #e7ecef; max-width: 65ch; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; background: rgba(0,0,0,0.35); border: 1px solid var(--line2); color: var(--text); padding: 9px 12px; font: 600 15px var(--f-disp); display: flex; gap: 10px; align-items: center; }
.opt:hover { border-color: var(--amber); background: rgba(255,179,64,0.08); }
.opt .ic { width: 22px; text-align: center; color: var(--amber); }
.opt.q { color: #ffe9a8; } .opt.r { color: var(--good); }
.perks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.perk.sel { border-color: var(--pc, var(--amber)); box-shadow: 0 0 0 2px var(--pc, var(--amber)) inset, 0 0 24px color-mix(in srgb, var(--pc, var(--amber)) 25%, transparent); background: color-mix(in srgb, var(--pc, var(--amber)) 10%, var(--panel2)); }
.perk .ptx { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lvbar { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; position: sticky; bottom: 0; padding: 10px 0 2px; background: linear-gradient(transparent, var(--panel) 30%); }
#hPerk { pointer-events: auto; display: none; margin-top: 2px; font: 700 12px var(--f-disp); letter-spacing: .1em; color: #0b1010; background: #5dff9a; border: 0; padding: 6px 10px; animation: perkP 1.4s ease-in-out infinite; align-self: flex-start; }
@keyframes perkP { 50% { box-shadow: 0 0 0 4px rgba(93,255,154,0.35); } }
@media (max-width: 760px) { .perks { grid-template-columns: minmax(0, 1fr); } }
.perk { border: 1px solid var(--line2); background: var(--panel2); padding: 16px 14px; text-align: left; color: var(--text); display: flex; flex-direction: column; gap: 6px; min-height: 150px; transition: transform .12s; }
.perk:hover { transform: translateY(-3px); border-color: var(--amber); }
.perk .pi { font-size: 30px; color: var(--amber); }
.perk .pn { font: 700 17px var(--f-disp); }
.perk .pd { font-size: 14px; color: #cdd5d9; line-height: 1.4; }
.perk .pr { font: 700 10px var(--f-disp); letter-spacing: .14em; text-transform: uppercase; }
.perk.r1 { border-color: rgba(63,163,255,0.6); } .perk.r2 { border-color: rgba(255,154,31,0.8); box-shadow: 0 0 24px rgba(255,154,31,0.15) inset; }
/* ---------- Árbol de talentos (31b) */
.tlwin { height: min(90vh, 780px); }
.tlbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1 1 auto; justify-content: flex-end; min-width: 0; }
.tlpts { font: 600 13px var(--f-disp); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line2); padding: 5px 10px; background: rgba(0,0,0,.3); white-space: nowrap; }
.tlpts b { font-size: 20px; color: var(--text); margin-right: 3px; }
.tlpts.has { border-color: var(--xp); color: #bff5d2; } .tlpts.has b { color: var(--xp); }

.tlmain { display: flex; flex: 1; min-height: 0; }
